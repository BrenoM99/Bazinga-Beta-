const txt=`${t}\nBazinga 4x4: ${S.me.team.map(p=>p.n).join(', ')}\n`+S.log.map(l=>`${l.st}: ${l.g[0]}x${l.g[1]}${l.ot?' (OT)':''} ${l.win?'✅':'❌'}`).join('\n')+`\n⚽ ${gf} gols · 🧤 ${S.conc} sofridos · 👑 ${art}`;
window.share=()=>{try{navigator.clipboard.writeText(txt);$('#cp').textContent='Copiado!'}catch(e){$('#cp').textContent='Não foi possível copiar'}};
R(`<h1>${t}</h1><div class=box>${S.log.map(l=>`${l.st}: <b>${l.g[0]} x ${l.g[1]}</b>${l.ot?' (OT)':''} ${l.win?'✅':'❌'} <span class=mut>${l.o}</span>`).join('<br>')}</div>
${champ?'':`<h2>Quem eliminou você</h2><b>${S.cur.name}</b>${field(S.cur.team,S.cur.roles,{show:1,bs:S.cur.bs})}`}
<h2>📊 Números do seu time</h2><div class=box>⚽ Gols marcados: <b>${gf}</b><br>🧤 Gols sofridos: <b>${S.conc}</b><br>🛡️ Jogos sem sofrer gol: <b>${cs} de ${S.log.length}</b>${ogm+ogr?`<br>🥅 Gols contra: <b>${ogm}</b> seu(s) · <b>${ogr}</b> do rival a seu favor`:''}<br>👑 Artilheiro: <b>${art}</b><br>🔥 Maior vitória: <b>${best.g[0]} x ${best.g[1]}</b> <span class=mut>(${best.st}, contra ${best.o})</span></div>
${top.length>1?`<h2>Artilharia</h2><div class=box>${top.slice(0,5).map(([n,g],i)=>`${i+1}. ${n} — <b>${g}</b> gol${g>1?'s':''}`).join('<br>')}</div>`:''}
<button class=btn onclick="share()"><span id=cp>Copiar resultado</span></button><button class="btn ghost" onclick="home()">Jogar de novo</button>`)}
home();
</script></body></html>
