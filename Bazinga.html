function accEnc(){const K=accKeys(),all=K.r.concat(K.p),bits=[];for(let i=15;i>=0;i--)bits.push((hsh(all.join('\n'))>>i)&1);

function accDec(c){const K=accKeys(),all=K.r.concat(K.p),bits=[];for(const ch of c.replace(/[^A-Z2-9]/g,'')){const v=A32.indexOf(ch);if(v<0)return null;for(let j=4;j>=0;j--)bits.push((v>>j)&1)}

return{r:K.r.filter((k,i)=>bits[16+i]),p:K.p.filter((n,i)=>bits[16+K.r.length+i])}}

function savePub(code,data){let n=0;return brRun({on:(c,done)=>c.on('connect',()=>c.publish(SVT+code,data,{qos:1,retain:true},()=>{n++;if(n>=BR.length)done(n)})),fin:()=>n},7000)}
function saveGet(code){return brRun({on:(c,done)=>{c.on('connect',()=>c.subscribe(SVT+code,{qos:1}));c.on('message',(tp,m)=>{const s=m.toString();if(s)done(s)})}},9000)}
function conta(msg){R(`<h1>🔑 Código da conta</h1><p class=mut>Leva o seu progresso (reações e personagens) para outro aparelho. É uma cópia feita na hora: os aparelhos não ficam sincronizados.</p>
<div class=box><b>Copiar daqui para outro aparelho</b><div id=accbox><button class=btn onclick="accShow()">👁️ Revelar código da conta</button></div></div>
<div class=box><b>Receber progresso aqui</b><input id=ac class=inp placeholder="Cole o código aqui"><button class=btn onclick="accImport()">📥 Importar código</button><p id=accmsg class=mut>${msg||''}</p></div><button class="btn ghost" onclick="livro()">Voltar</button>`)}
async function accShow(){const b=$('#accbox');b.innerHTML='<p class=mut>Gerando código...</p>';const long=accEnc(),code=r8(),n=await savePub(code,long);
b.innerHTML=`${n?`<div style="font:800 34px ui-monospace,monospace;letter-spacing:4px;text-align:center;margin:10px 0">${code.slice(0,4)}-${code.slice(4)}</div><p class=mut>Digite este código no outro aparelho (internet nos dois). Use logo: o servidor pode apagá-lo depois de um tempo.</p>`:'<p class=bad>Não consegui salvar online. Use o código completo abaixo.</p>'}<details><summary>Código completo (funciona sem internet)</summary><p style="word-break:break-all;font-family:ui-monospace,monospace">${long}</p></details>`}
async function accImport(){const raw=(($('#ac')&&$('#ac').value)||'').toUpperCase().replace(/[^A-Z2-9]/g,''),m=$('#accmsg'),say=s=>{if(m)m.textContent=s};if(!raw)return say('Cole um código primeiro.');
let long=raw;if(raw.length<=10){say('Buscando o código...');long=await saveGet(raw.slice(0,8));if(!long)return say('Código não encontrado ou expirado. Use o código completo do outro aparelho.')}
const d=accDec(long);if(!d)return say('Código inválido.');if(d.err)return say(d.err);const r=accApply(d);say(`✅ Progresso importado: ${r.nr} reação(ões) e ${r.np} personagem(ns) novos.`);toast('🔑 Progresso importado')}

try{['bazinga_carreira_v1','bazinga_treinador_v1'].forEach(k=>localStorage.removeItem(k))}catch(e){}
home();
</script></body></html>
