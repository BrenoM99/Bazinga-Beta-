<style>

.btn{background:var(--acc);color:#fff;border:0;font-weight:700;width:100%;padding:14px;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}.btn:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;min-height:64px;background:var(--card)}
.slot.act{border:2px solid var(--acc)}.slot b{display:block;font-size:11px;color:var(--mut)}

.card b{font-size:18px}.card small{display:block;color:var(--mut)}
.Base{--c:#64748b}.Especial{--c:#a855f7}.Variante{--c:#14b8a6}.Lenda{--c:#f5b301;box-shadow:0 0 18px #f5b30166}

.good{color:var(--acc);margin:4px 0}.bad{color:var(--bad);margin:4px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.pitch{background:repeating-linear-gradient(#2f8f4e 0 38px,#2a8347 38px 76px);border:3px solid #fff8;border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;gap:14px;margin:10px 0}
.row{display:flex;justify-content:center;gap:14px}.row:empty{display:none}.sp{display:flex;flex-direction:column;align-items:center;width:84px}
.spot{width:58px;height:58px;border-radius:50%;border:3px dashed #fffa;background:#0003;color:#fff;font:700 12px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.1}
.spot.free{border-style:solid;border-color:#ffe14d;animation:pulse 1s infinite}.spot.has{border:3px solid var(--c);background:#0b1020;cursor:default}
.nm{color:#fff;font:700 12px system-ui;text-shadow:0 1px 2px #000;margin-top:3px;text-align:center}
.card.rolling{min-height:84px;opacity:.85;border-style:dashed;animation:shake .12s infinite}.spot.mv{box-shadow:0 0 0 3px #ffe14d;transform:scale(1.1)}.pitch.static .spot{pointer-events:none}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}.card.sel{box-shadow:0 0 0 3px var(--acc)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.1)}}@keyframes shake{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
#mb{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:9;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 9px;font-size:16px;cursor:pointer}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:4px;margin:8px 0}
</style></head><body><div id="app"></div>

const HW=.3,W={Base:77,Variante:9,Especial:13,Lenda:1},$=s=>document.querySelector(s),R=h=>{$('#app').innerHTML=h;scrollTo(0,0)};

<h2>Modo</h2><div class=chips>${chips('mode',{classico:'Clássico (vê os níveis)',almanaque:'Almanaque (às cegas)'})}</div>
<button class=btn onclick="start()">Jogar</button>`)}
function tier(){let r=Math.random()*100,c=0;for(const k in W){c+=W[k];if(r<c)return k}return'Base'}
const wt=p=>p.t=='Base'&&Math.max(p.a,p.v,p.g)>=90?HW:1,wpick=a=>{let r=Math.random()*a.reduce((s,p)=>s+wt(p),0);for(const p of a){r-=wt(p);if(r<=0)return p}return a[a.length-1]};

return p?`<div class=sp><button class="spot has ${p.t} ${o.mv===i?'mv':''}" ${c}><i>${x}</i>${o.show?stat(p,x)+(o.bs?o.bs[i]||0:0):''}</button><span class=nm>${p.n}</span></div>`:`<div class=sp><button class="spot ${o.sel?'free':''}" ${c}><i>${x}</i>${o.sel&&o.show?stat(o.sel,x):''}</button></div>`}).join('')}</div>`).join('')}</div>`}
function draft(){const blind=S.mode=='almanaque',r=S.sel!=null?S.cards[S.sel]:null;
R(`<div class=top><span>Escolha ${S.team.filter(Boolean).length+1}/4</span><span>${FN[S.form]}</span></div>
${S.cards.map((p,i)=>S.rev[i]?`<button class="card ${p.t} ${i==S.pop?'pop':''} ${i==S.sel?'sel':''}" onclick="selc(${i})"><b>${p.n}</b><small><span class=tag>${p.t}</span> · ${p.o}</small>
${blind?'<div class=st>níveis ocultos</div>':`<div class=st><span>ATA ${p.a}</span><span>VOL ${p.v}</span><span>GK ${p.g}</span></div>`}</button>`:`<div class="card rolling" id="g${i}"></div>`).join('')}
<button class="btn ghost" ${S.rerolls&&full()?'':'disabled'} onclick="S.rerolls--;S.mv=null;deal();roll()">🎲 Rerolar (${S.rerolls} restante${S.rerolls==1?'':'s'})</button>
${chemHint()}<p class=mut id=hint>${S.mv!=null?'Toque em outra posição para trocar de lugar.':r?'Toque na posição do campo onde '+r.n+' vai jogar 👇':'Toque em uma carta e depois na posição no campo. Já escalou alguém? Toque nele para trocar de posição.'}</p>${field(S.team,S.roles,{click:1,show:!blind,sel:r,mv:S.mv})}`)}
function selc(i){if(!full())return;S.mv=null;S.sel=i;SND.put();draft()}

function start(){S={...C,team:[null,null,null,null],roles:FORMS[C.form],rerolls:2,round:0,log:[],conc:0,rev:[1,1,1],mv:null,rv:0};deal();roll()}
const QUAD=['Loki','Leone','Ace','Milagre'];
const SYN=[['Esquema','Ace','Milagre'],['Gênios','Neo','Loki'],['Dupla do Ano','Leone','Loki'],['Assistentes','Leone','Neo'],['Criaturas','Nabuco','Abuco'],['Sulistas','Larpal','Gutowiski'],['Dengosos','Xupista','Veloz e Rápido'],['Muro','Nabuco','Nuvem'],['Love-me','Jaczinn','Void'],['Veloz e Rápido Glaze','Neo','Veloz e Rápido'],['Glaze absurdo','Fumasa','Void'],['Glaze','Fumasa','Guxw'],['Pai e Mãe HDT','Neo','Kazi'],['L2','Athânio','Daniel'],['G.O.A.T','Athânio','Paulo Dados'],['L4','Paulo Dados','Daniel']];

const chemTag=c=>c.b?`<div class=box style="border-color:var(--acc)">⚗️ <b>${c.n}</b>: +${c.b} em todos os jogadores</div>`:'';
const tags=m=>chemTag(m.chem)+(m.links.length?`<div class=box style="border-color:var(--acc)">🔗 <b>Imersão Química</b>: ${m.links.join(', ')} <span class=mut>(+1 nos envolvidos em cada)</span></div>`:'')+(m.pal?`<div class=box style="border-color:var(--bad)">🤡 <b>PALHACINHO!</b> Xupista ganha +2 em tudo contra o Void</div>`:'');

function mk(team,roles,style,name,foe){const ks=team.map(who),fk=foe?foe.map(who):[],c=chem(team),links=SYN.filter(s=>ks.includes(s[1])&&ks.includes(s[2])),pal=ks.includes('Xupista')&&fk.includes('Void');

function genOpp(r){const lo=Math.min(.6,r*.1),hi=lo+.4,roles=FORMS[rnd(Object.keys(FORMS))],used=new Set(),team=roles.map(ro=>{const s=[...P].sort((x,y)=>stat(x,ro)-stat(y,ro));let b=s.slice(Math.floor(lo*s.length),Math.ceil(hi*s.length)).filter(p=>!used.has(p.n));if(!b.length)b=s.filter(p=>!used.has(p.n));const p=rnd(b);used.add(p.n);return p});
const star=team.reduce((a,p,i)=>stat(p,roles[i])>stat(a,roles[team.indexOf(a)])?p:a);return mk(team,roles,rnd(['def','eq','of']),'Esquadrão '+star.n)}
function preview(){const o0=genOpp(S.round),o=S.cur=mk(o0.team,o0.roles,o0.style,o0.name,S.team),m=S.me=mk(S.team,S.roles,S.style,'Você',o0.team),n=Math.round;
R(`<div class=top><span>Fase ${S.round+1}/7</span><span>Gols sofridos: ${S.conc}</span></div><h1>${STG[S.round]}</h1>
<b>${o.name}</b>${tags(o)}${field(o.team,o.roles,{flip:1,show:1,bs:o.bs})}<h2 style="text-align:center;margin:0">⚔️ VS ⚔️</h2><b>Seu time</b>${tags(m)}${field(m.team,m.roles,{show:1,bs:m.bs})}
<div class=box><div class=cmp><span></span><b>Você</b><b>Rival</b><span>Ataque</span><span>${n(m.att)}</span><span>${n(o.att)}</span><span>Defesa</span><span>${n(m.def)}</span><span>${n(o.def)}</span><span>Geral</span><b>${m.ovr}</b><b>${o.ovr}</b></div></div><button class=btn onclick="play()">▶ Jogar partida</button>`)}
function pois(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return Math.min(k-1,9)}
function scorer(t){const w=t.team.map((p,i)=>(t.roles[i]=='ATA'?3:t.roles[i]=='VOL'?1.2:.05)*stat(p,t.roles[i])/100);let r=Math.random()*w.reduce((a,b)=>a+b),i=0;while((r-=w[i])>0&&i<3)i++;return t.team[i].n}
function sim(A,B){const la=1.4*Math.exp((A.att-B.def)/12),lb=1.4*Math.exp((B.att-A.def)/12),g=[pois(la),pois(lb)],ev=[];
[A,B].forEach((x,s)=>{for(let i=0;i<g[s];i++)ev.push({m:1+Math.random()*300|0,s,who:scorer(x)})});ev.sort((x,y)=>x.m-y.m);
let ot=0;if(g[0]==g[1]){const s=Math.random()<la/(la+lb)?0:1,m=300+Math.max(1,Math.ceil(-Math.log(1-Math.random())/((la+lb)*3/300)));ev.push({m,s,who:scorer(s?B:A),ot:1});g[s]++;ot=m}
return{g,ev,win:g[0]>g[1],ot}}
async function play(){const me=S.me,o=S.cur,res=sim(me,o);let a=0,b=0,ei=0;skip=false;SND.whistle();
R(`<div class=top><span>${STG[S.round]}</span><b id=clk>0:00</b></div><div class=score><span>Você</span><b id=sc>0 x 0</b><span>${o.name}</span></div><div id=ev></div><div id=act><button class="btn ghost" onclick="skip=true">⏩ Pular</button></div>`);
const log=h=>$('#ev').innerHTML+=h,mm=s=>(s/60|0)+':'+String(s%60).padStart(2,'0'),last=res.ot||300;
for(let m=1;m<=last;m++){if(!skip)await sleep(m>300?40:26);$('#clk').textContent=mm(m);
if(m==301){log('<p><b>⏱️ OVERTIME!</b> <span class=mut>Empatou aos 5:00. Quem fizer o primeiro gol vence.</span></p>');SND.whistle();if(!skip)await sleep(800)}
while(ei<res.ev.length&&res.ev[ei].m<=m){const e=res.ev[ei++];e.s?b++:a++;SND[e.s?'conc':'goal']();$('#sc').textContent=a+' x '+b;log(`<p class="${e.s?'bad':'good'}">${mm(e.m)} ⚽ ${e.who}${e.s?' ('+o.name+')':''}${e.ot?' <b>— gol de ouro!</b>':''}</p>`);if(!skip)await sleep(700)}}
log('<p class=mut>🏁 Fim de jogo</p>');if(!skip)await sleep(500);
S.conc+=res.g[1];S.log.push({st:STG[S.round],o:o.name,g:res.g,ot:!!res.ot,win:res.win,sc:res.ev.filter(e=>!e.s).map(e=>e.who)});
SND[res.win?'win':'lose']();const last2=res.win&&S.round==6,nxt=res.win&&!last2;
$('#act').innerHTML=`<h2>${res.win?'✅ Vitória!':'❌ Eliminado'}</h2>`+(nxt?`<button class=btn onclick="S.round++;preview()">Próxima fase</button>`:`<button class=btn onclick="end(${res.win})">Ver resultado</button>`)}
function end(champ){const perfect=champ&&S.conc==0,t=perfect?'🏆 7 A 0 PERFEITO!':champ?'🏆 CAMPEÃO!':'Eliminado nas '+STG[S.round];
const gf=S.log.reduce((s,l)=>s+l.g[0],0),cs=S.log.filter(l=>l.g[1]==0).length,sc={};S.log.forEach(l=>l.sc.forEach(n=>sc[n]=(sc[n]||0)+1));
const top=Object.entries(sc).sort((x,y)=>y[1]-x[1]),best=[...S.log].sort((x,y)=>(y.g[0]-y.g[1])-(x.g[0]-x.g[1]))[0],art=top.length?`${top[0][0]} (${top[0][1]})`:'ninguém marcou';
const txt=`${t}\nBazinga 4x4: ${S.me.team.map(p=>p.n).join(', ')}\n`+S.log.map(l=>`${l.st}: ${l.g[0]}x${l.g[1]}${l.ot?' (OT)':''} ${l.win?'✅':'❌'}`).join('\n')+`\n⚽ ${gf} gols · 🧤 ${S.conc} sofridos · 👑 ${art}`;
window.share=()=>{try{navigator.clipboard.writeText(txt);$('#cp').textContent='Copiado!'}catch(e){$('#cp').textContent='Não foi possível copiar'}};
R(`<h1>${t}</h1><div class=box>${S.log.map(l=>`${l.st}: <b>${l.g[0]} x ${l.g[1]}</b>${l.ot?' (OT)':''} ${l.win?'✅':'❌'} <span class=mut>${l.o}</span>`).join('<br>')}</div>
${champ?'':`<h2>Quem eliminou você</h2><b>${S.cur.name}</b>${field(S.cur.team,S.cur.roles,{show:1,bs:S.cur.bs})}`}
<h2>📊 Números do seu time</h2><div class=box>⚽ Gols marcados: <b>${gf}</b><br>🧤 Gols sofridos: <b>${S.conc}</b><br>🛡️ Jogos sem sofrer gol: <b>${cs} de ${S.log.length}</b><br>👑 Artilheiro: <b>${art}</b><br>🔥 Maior vitória: <b>${best.g[0]} x ${best.g[1]}</b> <span class=mut>(${best.st}, contra ${best.o})</span></div>
${top.length>1?`<h2>Artilharia</h2><div class=box>${top.slice(0,5).map(([n,g],i)=>`${i+1}. ${n} — <b>${g}</b> gol${g>1?'s':''}`).join('<br>')}</div>`:''}
<button class=btn onclick="share()"><span id=cp>Copiar resultado</span></button><button class="btn ghost" onclick="home()">Jogar de novo</button>`)}
home();
</script></body></html>
